name: Build and Release BLNT Trade to IPFS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ipfs-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_COMMIT: 66fae2ef953e2855521048219d4309817e947ba2
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

jobs:
  build-pin-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: blnt-ui
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        id: source
        working-directory: blnt-ui
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          git fetch --no-tags origin main
          source_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source_commit" origin/main
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout current release tooling for a manual recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: release-tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout pinned SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BLNT-Protocol/blnt-sdk-js
          ref: ${{ env.SDK_COMMIT }}
          path: blnt-sdk-js
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            blnt-sdk-js/package-lock.json
            blnt-ui/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.13.0

      - name: Install and build SDK
        working-directory: blnt-sdk-js
        run: |
          npm ci
          npm run build

      - name: Install and build mainnet UI
        working-directory: blnt-ui
        run: |
          npm ci
          npm run build:mainnet

      - name: Verify required static routes
        run: |
          test -f blnt-ui/out/index.html
          test -f blnt-ui/out/backfill/index.html
          test -f blnt-ui/out/manager/index.html
          test -f blnt-ui/out/termsofservice/index.html

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --directory blnt-ui/out \
            --create \
            --gzip \
            --file release-artifacts/blnt-trade-${RELEASE_TAG}.tar.gz \
            .

      - name: Initialize Kubo and compute the local build CID
        id: ipfs
        uses: ipfs/ipfs-deploy-action@bb46d65c97660ef08ecaf93e9c187afcee668185 # v3
        with:
          path-to-deploy: blnt-ui/out
          github-token: ${{ github.token }}
          set-github-status: 'false'
          set-pr-comment: 'false'
          cid-profile: ''
          ipfs-add-options: '--cid-version=1'
          car-file-name: blnt-trade-${{ env.RELEASE_TAG }}.car
          upload-car-artifact: 'false'

      - name: Upload and pin directory with Pinata
        id: pinata
        env:
          PINATA_JWT_TOKEN: ${{ secrets.PINATA_JWT_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test -n "$PINATA_JWT_TOKEN"
          pin_name="blnt-trade-${RELEASE_TAG}-${SOURCE_COMMIT:0:7}"
          upload_script='blnt-ui/.github/scripts/upload-pinata-directory.mjs'
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            upload_script='release-tooling/.github/scripts/upload-pinata-directory.mjs'
          fi
          returned_cid="$(node "$upload_script" \
            blnt-ui/out \
            "$pin_name")"
          printf 'cid=%s\n' "$returned_cid" >> "$GITHUB_OUTPUT"
          echo "Pinned ${returned_cid} as ${pin_name}."

      - name: Retrieve and verify pinned CAR
        id: verify
        env:
          PINNED_CID: ${{ steps.pinata.outputs.cid }}
        run: |
          verified_car="release-artifacts/blnt-trade-${RELEASE_TAG}.car"
          retrieved=false
          for gateway in \
            'https://ipfs.filebase.io/ipfs' \
            'https://dweb.link/ipfs' \
            'https://ipfs.io/ipfs'; do
            if curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 180 \
              --output "$verified_car" \
              "${gateway}/${PINNED_CID}?format=car"; then
              retrieved=true
              break
            fi
          done
          if [ "$retrieved" != true ] || [ ! -s "$verified_car" ]; then
            echo "::error::Unable to retrieve the pinned CAR for ${PINNED_CID}."
            exit 1
          fi

          daemon_log="$RUNNER_TEMP/ipfs-daemon.log"
          ipfs daemon > "$daemon_log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 12); do
            if ipfs id > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              cat "$daemon_log"
              echo '::error::Local IPFS daemon did not become ready.'
              exit 1
            fi
            sleep 1
          done

          ipfs dag import "$verified_car"

          comparison_file="$(mktemp)"
          while IFS= read -r -d '' local_file; do
            relative_path="${local_file#blnt-ui/out/}"
            ipfs cat "/ipfs/${PINNED_CID}/${relative_path}" > "$comparison_file"
            cmp "$local_file" "$comparison_file"
          done < <(find blnt-ui/out -type f -print0 | sort -z)

          printf 'car_path=%s\n' "$verified_car" >> "$GITHUB_OUTPUT"
          echo "Verified every exported file under ${PINNED_CID}."

      - name: Assemble verifiable release evidence
        env:
          CAR_PATH: ${{ steps.verify.outputs.car_path }}
          CID: ${{ steps.pinata.outputs.cid }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test -s "$CAR_PATH"
          printf '%s\n' "$CID" > release-artifacts/ipfs-cid.txt
          printf '%s\n' "$SOURCE_COMMIT" > release-artifacts/source-commit.txt
          sha256sum \
            "release-artifacts/blnt-trade-${RELEASE_TAG}.tar.gz" \
            "release-artifacts/blnt-trade-${RELEASE_TAG}.car" \
            release-artifacts/ipfs-cid.txt \
            release-artifacts/source-commit.txt \
            > release-artifacts/checksums.txt

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blnt-trade-${{ env.RELEASE_TAG }}
          path: release-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Check automatic release credentials
        id: release-auth
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'RELEASE_TOKEN is not configured; preserving artifacts for a maintainer-created release.'
          fi

      - name: Create GitHub release
        if: steps.release-auth.outputs.available == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.source.outputs.commit }}
          name: BLNT Trade ${{ env.RELEASE_TAG }}
          body: |
            ## BLNT Trade release

            This release contains the mainnet static export served by BLNT Trade.

            - Source commit: `${{ steps.source.outputs.commit }}`
            - Pinned BLNT SDK commit: `${{ env.SDK_COMMIT }}`
            - IPFS CID: `${{ steps.pinata.outputs.cid }}`
            - IPFS URI: `ipfs://${{ steps.pinata.outputs.cid }}/`

            Verify the attached checksums before using the archive or CAR file.
          draft: false
          prerelease: false
          files: |
            release-artifacts/blnt-trade-${{ env.RELEASE_TAG }}.tar.gz
            release-artifacts/blnt-trade-${{ env.RELEASE_TAG }}.car
            release-artifacts/ipfs-cid.txt
            release-artifacts/source-commit.txt
            release-artifacts/checksums.txt
