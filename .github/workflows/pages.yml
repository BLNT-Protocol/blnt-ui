name: Deploy testnet UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          path: blnt-ui

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: BLNT-Protocol/blnt-sdk-js
          path: blnt-sdk-js
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            blnt-sdk-js/package-lock.json
            blnt-ui/package-lock.json

      - name: Install and build SDK
        working-directory: blnt-sdk-js
        run: |
          npm ci
          npm run build

      - name: Install and build testnet UI
        working-directory: blnt-ui
        run: |
          npm ci
          npm run build:testnet

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: blnt-ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
